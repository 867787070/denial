name: ARM64 Build

on:
  push:
    branches:
      - arm64-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-build:
    name: Build ARM64 packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    env:
      DENIAL_ARCH: aarch64
      DENIAL_FLUTTER_ARCH: arm64
      DENIAL_FLUTTER_PLATFORM: linux-arm64
      DENIAL_BUILD_JOBS: 6

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git curl jq file rsync gpg make cmake ninja-build pkg-config g++ binutils \
            libdbus-1-dev libgtk-3-dev libinput-dev libudev-dev \
            libdrm-dev libgbm-dev libegl-dev libxkbcommon-dev \
            libpulse-dev libfontconfig1-dev libfreetype6-dev \
            libseat-dev libsystemd-dev zstd libbsd-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy, rustfmt

      - name: Configure Cargo for ARM64
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Bootstrap Denial
        run: |
          ./tools/denial-pc bootstrap

      - name: Build Flutter engine for ARM64
        env:
          DENIAL_FLUTTER_ENGINE_JOBS: 6
        run: |
          # No committed ARM64 args.gn exists yet, so denial-flutter-engine takes
          # its "unqualified native" path: it verifies the generated graph really
          # targets arm64 and skips the x64 byte-for-byte comparison.
          test ! -e prebuilt/flutter-engine/linux-arm64-release/args.gn
          ./tools/denial-flutter-engine prepare-app-build
          file prebuilt/flutter-engine/linux-arm64-release/libflutter_engine.so

      - name: Build Denial
        run: |
          ./tools/denial-pc build

      - name: Build Debian packages
        run: |
          ./tools/denial-pc debian-package
          # package-denial-deb hardcodes _amd64 in the output filename even though
          # dpkg-deb records the real Architecture in DEBIAN/control. Rename so the
          # artifacts match their actual architecture.
          for deb in ~/.cache/denial/pc-build/packages/*_amd64.deb; do
            mv -- "$deb" "${deb%_amd64.deb}_arm64.deb"
          done
          ls -la ~/.cache/denial/pc-build/packages/

      - name: Verify packages
        run: |
          for deb in ~/.cache/denial/pc-build/packages/*.deb; do
            echo "=== $(basename "$deb") ==="
            dpkg-deb -I "$deb" | grep -E 'Package|Version|Architecture'
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: denial-arm64-packages
          path: ~/.cache/denial/pc-build/packages/*.deb
          retention-days: 14
