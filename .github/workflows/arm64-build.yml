name: ARM64 Build

on:
  push:
    branches:
      - arm64-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-build:
    name: Build ARM64 packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    env:
      DENIAL_ARCH: aarch64
      DENIAL_FLUTTER_ARCH: arm64
      DENIAL_FLUTTER_PLATFORM: linux-arm64
      DENIAL_BUILD_JOBS: 6

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git curl jq file rsync gpg make cmake ninja-build pkg-config \
            libdbus-1-dev libgtk-3-dev libinput-dev libudev-dev \
            libdrm-dev libgbm-dev libegl-dev libxkbcommon-dev \
            libpulse-dev libfontconfig1-dev libfreetype6-dev \
            libseat-dev libsystemd-dev zstd libbsd-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy, rustfmt

      - name: Configure Cargo for ARM64
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Set up depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Create ARM64 Flutter engine args.gn
        run: |
          mkdir -p prebuilt/flutter-engine/linux-arm64-release
          cat > prebuilt/flutter-engine/linux-arm64-release/args.gn << 'ARGSGN'
buildtools_path = "//flutter/buildtools"
is_debug = false
optimize_for_size = false
engine_version = "d0817320163b3fb5a284e63cc21f2d6b9138442b"
content_hash = "ec4d3ab5a8b09a32656c8b948452debbcc34dc27"
skia_version = "0ee042f542b3e79f5ac49115387718c6bb3d7d34"
dart_version = "d684a576a6aa954ae107a03b2b4e1d61c3bebe93"
full_dart_sdk = false
skia_use_libpng_decode = true
skia_use_libpng_encode = true
skia_use_rust_png_decode = false
skia_use_rust_png_encode = false
skia_use_dng_sdk = false
skia_enable_pdf = false
skia_use_x11 = false
skia_use_wuffs = true
skia_use_expat = true
skia_use_fontconfig = true
skia_use_icu = true
skia_use_xps = false
is_official_build = true
android_full_debug = false
is_clang = true
skia_gl_standard = ""
use_clang_static_analyzer = false
enable_coverage = false
enable_lto = true
host_os = "linux"
host_cpu = "arm64"
target_os = "linux"
target_cpu = "arm64"
dart_target_arch = "arm64"
flutter_use_fontconfig = true
dart_component_kind = "static_library"
embedder_for_target = false
dart_lib_export_symbols = false
flutter_runtime_mode = "release"
dart_version_git_info = true
dart_runtime_mode = "release"
concurrent_toolchain_jobs = 6
dart_sdk_verification_hash = "d684a576a6"
enable_desktop_embeddings = true
enable_backtrace = true
dart_disable_secure_socket = false
use_default_linux_sysroot = true
skia_use_gl = true
skia_use_vulkan = true
skia_use_vma = false
shell_enable_vulkan = true
disable_hidden_visibility = false
flutter_prebuilt_dart_sdk = true
dart_sdk_output = "built-dart-sdk"
stripped_symbols = true
angle_enable_commit_id = false
angle_build_all = false
angle_has_astc_encoder = false
angle_enable_libdrm = false
angle_use_x11 = false
angle_use_wayland = false
angle_enable_vulkan_validation_layers = false
angle_vulkan_headers_dir =
    "//flutter/third_party/vulkan-deps/vulkan-headers/src"
angle_vulkan_loader_dir = "//flutter/third_party/vulkan-deps/vulkan-loader/src"
angle_vulkan_tools_dir = "//flutter/third_party/vulkan-deps/vulkan-tools/src"
angle_lunarg_vulkantools_dir =
    "//flutter/third_party/vulkan-deps/lunarg-vulkantools/src"
ARGSGN

      - name: Bootstrap Denial
        run: |
          ./tools/denial-pc bootstrap

      - name: Build Flutter engine for ARM64
        env:
          DENIAL_FLUTTER_ENGINE_JOBS: 6
        run: |
          ./tools/denial-flutter-engine build

      - name: Build Denial
        run: |
          ./tools/denial-pc build

      - name: Patch PKGBUILD for aarch64
        run: |
          sed -i "s/arch=('x86_64')/arch=('aarch64')/" packaging/arch/PKGBUILD
          sed -i "s|linux/x64/release|linux/arm64/release|g" packaging/arch/PKGBUILD
          sed -i "s/arch=('x86_64')/arch=('aarch64')/" packaging/arch/flutter-engine/PKGBUILD
          sed -i "s|linux-x64-release|linux-arm64-release|g" packaging/arch/flutter-engine/PKGBUILD

      - name: Build Arch packages
        run: |
          ./tools/denial-pc arch-package

      - name: Verify packages
        run: |
          ls -la ~/.cache/denial/pc-build/packages/
          file ~/.cache/denial/pc-build/packages/*.pkg.tar.zst || true
          bsdtar -tf ~/.cache/denial/pc-build/packages/*.pkg.tar.zst | head -20 || true

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: denial-arm64-packages
          path: ~/.cache/denial/pc-build/packages/*.pkg.tar.zst
          retention-days: 14
